# genesis-player (AURUM) CI gate — Engineering Excellence build #3 (days 1–30)
#
# Builds the debug APK and runs unit tests on every commit.
# Owner: Forge Master (Hephaestus) + Release Captain (Zane).
# Industry best: GitHub Actions + branch protection.
#
# RUNNER: runs on ubuntu-latest today. When the penguin build farm is
# registered as a self-hosted runner, set the repository variable
# CI_RUNNER_LABEL to the runner label (e.g. "penguin-build") and the same
# workflow moves there automatically — no workflow edit needed.
#   gh variable set CI_RUNNER_LABEL --body "penguin-build"
# Penguin is the Docker-capable node; the APK build belongs there long-term.
# Fallback stays ubuntu-latest so CI never depends on penguin being awake.

name: CI

on:
  push:
    branches: [main, aurum-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: assembleDebug + unit tests
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Repo has no Gradle wrapper checked in; pin a Gradle compatible with
      # AGP 8.5.2 (Gradle 8.7+). TODO (build #4, AURUM release pipeline):
      # commit a wrapper (gradle wrapper --gradle-version 8.7) so the build
      # is hermetic instead of action-pinned.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK + run unit tests
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest

      # TODO (build #4): release-only gate — assembleRelease must NOT be
      # debuggable and config (backend hostname, buildConfig fields) must be
      # validated at build time. The debuggable-shipped-debug APK (2026-09)
      # is the regression this becomes.
