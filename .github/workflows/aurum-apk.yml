name: aurum-apk
# Aurum Pulse 2 (claude/** branches): JVM unit tests -> debug APK -> emulator smoke test with a SYNTHETIC Takeout.
# The owner's real history never enters the repo or CI; the app imports it on the phone.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ensure Android packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          CT=$(ls -d "$ANDROID_HOME"/cmdline-tools/* | head -1)
          export PATH="$CT/bin:$PATH"
          echo "$CT/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "emulator" "system-images;android-34;google_apis;x86_64"
      - name: JVM unit tests
        working-directory: android
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle testDebugUnitTest --no-daemon
          python3 ../.github/scripts/junit_summary.py app/build/test-results/testDebugUnitTest
      - name: Live API contract tests (Audius + Internet Archive, neutral queries, non-blocking)
        continue-on-error: true
        working-directory: android
        env:
          CRATE_CONTRACT: '1'
        run: /tmp/gradle-8.7/bin/gradle testDebugUnitTest --tests '*CrateContractTest' --no-daemon 2>&1 | grep -E "AUDIUS|ARCHIVE|PASSED|FAILED|SKIPPED|BUILD"
      - name: Build debug APK
        working-directory: android
        run: |
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
          ls -l app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurum-pulse-2-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/apk.sha256
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurum-unit-tests
          path: android/app/build/test-results/testDebugUnitTest
      - name: Boot emulator
        run: bash .github/scripts/boot_emulator.sh
      - name: Smoke test (install, import synthetic Takeout, open Apollo + Library, no crash)
        run: |
          set -x
          PKG=com.apexforge.genesisplayer
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
          adb logcat -c
          adb shell am start -W -n $PKG/.MainActivity
          sleep 6; adb exec-out screencap -p > /tmp/aurum_1_first_run.png
          adb shell uiautomator dump /sdcard/ui0.xml >/dev/null; adb pull /sdcard/ui0.xml /tmp/ui0.xml
          grep -q 'Your sound. Turned alive.' /tmp/ui0.xml
          # Put the synthetic Takeout in the app's PRIVATE files dir (debug build: run-as), as a phone download would
          # be read through the picker; scoped storage denies the app files the shell creates under Android/data.
          adb push .github/fixtures/synthetic-watch-history.json /data/local/tmp/watch-history.json
          adb shell "cat /data/local/tmp/watch-history.json | run-as $PKG sh -c 'mkdir -p files && cat > files/watch-history.json'"
          adb shell run-as $PKG ls -l files/
          adb shell am start -S -n $PKG/.MainActivity -a $PKG.TEST_IMPORT --es path /data/data/$PKG/files/watch-history.json
          for i in $(seq 1 40); do adb logcat -d -s GenesisPlayer | grep -q "TEST_IMPORT" && break; sleep 1; done
          adb logcat -d -s GenesisPlayer | grep TEST_IMPORT | tee /tmp/import.log
          grep -q "TEST_IMPORT ok plays=240" /tmp/import.log
          adb shell am start -S -W -n $PKG/.MainActivity
          sleep 8; adb exec-out screencap -p > /tmp/aurum_2_apollo.png
          adb shell uiautomator dump /sdcard/ui.xml >/dev/null; adb pull /sdcard/ui.xml /tmp/ui.xml
          grep -o 'text="Apollo"' /tmp/ui.xml | head -1
          grep -q 'Play For You' /tmp/ui.xml
          B=$(python3 -c "import re;x=open('/tmp/ui.xml').read();m=re.search(r'text=\"Archive\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]',x);print((int(m[1])+int(m[3]))//2,(int(m[2])+int(m[4]))//2)")
          adb shell input tap $B; sleep 3; adb exec-out screencap -p > /tmp/aurum_3_library.png
          adb shell uiautomator dump /sdcard/ui2.xml >/dev/null; adb pull /sdcard/ui2.xml /tmp/ui2.xml
          grep -q 'Sample Artist' /tmp/ui2.xml
          C=$(python3 -c "import re;x=open('/tmp/ui2.xml').read();m=re.search(r'text=\"Crate\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]',x);print((int(m[1])+int(m[3]))//2,(int(m[2])+int(m[4]))//2)")
          adb shell input tap $C; sleep 3
          adb shell uiautomator dump /sdcard/ui3.xml >/dev/null; adb pull /sdcard/ui3.xml /tmp/ui3.xml
          grep -q 'OFFLINE CRATE' /tmp/ui3.xml
          M=$(python3 -c "import re;x=open('/tmp/ui3.xml').read();m=re.search(r'text=\"Match my library\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]',x);print((int(m[1])+int(m[3]))//2,(int(m[2])+int(m[4]))//2)")
          adb shell input tap $M
          for i in $(seq 1 45); do sleep 2; adb shell uiautomator dump /sdcard/ui4.xml >/dev/null 2>&1; adb pull /sdcard/ui4.xml /tmp/ui4.xml >/dev/null 2>&1; grep -qE 'Checked 4 of 4 artists|Stopped' /tmp/ui4.xml && break; done
          adb exec-out screencap -p > /tmp/aurum_4_crate.png
          grep -o 'Checked [0-9]* of [0-9]* artists[^"]*' /tmp/ui4.xml | head -1
          grep -o 'Exact [0-9]* [^"]*' /tmp/ui4.xml | head -1
          grep -q 'Checked 4 of 4 artists' /tmp/ui4.xml
          ! adb logcat -d | grep -E "FATAL EXCEPTION.*|AndroidRuntime: Process: $PKG" | tee /tmp/crash.log | grep -q .
          adb shell pidof $PKG
      - name: Logcat on failure
        if: failure()
        run: adb logcat -d -s GenesisPlayer AurumMyMusic AndroidRuntime System.err | tail -80
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurum-smoke-screens
          path: |
            /tmp/aurum_*.png
            /tmp/import.log
            /tmp/crash.log
