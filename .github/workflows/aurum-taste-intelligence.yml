name: aurum-taste-intelligence
on:
  push:
    paths:
      - 'aurum-pulse/web/**'
      - 'aurum-pulse/tests/**'
      - '.github/workflows/aurum-taste-intelligence.yml'
  pull_request:
    paths:
      - 'aurum-pulse/web/**'
      - 'aurum-pulse/tests/**'
      - '.github/workflows/aurum-taste-intelligence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurum-taste-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pure-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic taste, profile and curation regression tests
        run: node --test --experimental-test-coverage aurum-pulse/tests/*.test.mjs
      - name: Verify tests detect targeted safety mutations
        run: python3 aurum-pulse/tests/mutation_gate.py
      - name: Syntax checks
        run: |
          node --check aurum-pulse/web/engine.mjs
          node --check aurum-pulse/web/taste-intelligence.mjs
          node --check aurum-pulse/web/app.mjs
