name: android-tests

# Emulator lane for pull requests: runs every instrumented test
# (android/app/src/androidTest) on an API-34 emulator, so queue/playback
# regressions show up on the PR instead of after merge. The full
# player-gate (gate.yml) still runs on push to main.
#
# Per-test PASS/FAIL is published as a check annotation by
# .github/scripts/junit_summary.py (readable via the checks API).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          CT=$(ls -d "$ANDROID_HOME"/cmdline-tools/* | head -1)
          export PATH="$CT/bin:$PATH"
          echo "$CT/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "emulator" "system-images;android-34;google_apis;x86_64"

      - name: Install Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build app + test APKs
        working-directory: android
        run: /tmp/gradle-8.7/bin/gradle assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Boot emulator
        run: bash .github/scripts/boot_emulator.sh

      - name: Instrumented tests (API 34)
        working-directory: android
        run: |
          set +e
          /tmp/gradle-8.7/bin/gradle connectedDebugAndroidTest --no-daemon
          GRADLE_RC=$?
          python3 ../.github/scripts/junit_summary.py app/build/outputs/androidTest-results "Instrumented tests (API 34)"
          SUMMARY_RC=$?
          [ $GRADLE_RC -eq 0 ] && [ $SUMMARY_RC -eq 0 ]

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/androidTests/connected
