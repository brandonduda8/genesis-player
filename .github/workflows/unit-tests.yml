name: unit-tests

# JVM fast lane: pure-logic unit tests (android/app/src/test) with no emulator.
# Runs on pull requests so every PR gets a quick signal before review; the
# full player-gate (gate.yml) runs the same tests again on push to main.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android platform
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          CT=$(ls -d "$ANDROID_HOME"/cmdline-tools/* | head -1)
          yes | "$CT/bin/sdkmanager" --licenses > /dev/null
          "$CT/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: JVM unit tests
        working-directory: android
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle testDebugUnitTest --no-daemon
          python3 ../.github/scripts/junit_summary.py app/build/test-results/testDebugUnitTest

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
