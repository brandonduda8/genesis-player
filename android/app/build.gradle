plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // (no kotlin.plugin.compose on Kotlin 1.9.x — see root build.gradle)
}

android {
    namespace 'com.apexforge.genesisplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.apexforge.genesisplayer'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1-apollo'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def media3 = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-session:$media3"
    implementation "androidx.media3:media3-common:$media3"

    implementation platform('androidx.compose:compose-bom:2024.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'com.google.guava:guava:33.2.1-android'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    // API-34 instrumented tests: tap-to-play queue repair (QueuePlannerTest,
    // TapLatencyTest). Run on the emulator via connectedDebugAndroidTest.
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
}
