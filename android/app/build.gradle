plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // (no kotlin.plugin.compose on Kotlin 1.9.x — see root build.gradle)
}

android {
    namespace 'com.apexforge.genesisplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.apexforge.genesisplayer'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '2.4.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Stable signing (issue #18): the release key lives ONLY in GitHub Secrets / the owner's machine, never in git.
    // CI writes it to a temp file and passes these env vars; without them the release build is left unsigned, so CI
    // fails loudly. It never silently falls back to a throwaway key.
    def ks = System.getenv("AURUM_KEYSTORE_FILE")
    signingConfigs {
        if (ks != null && new File(ks).exists()) {
            aurumRelease {
                storeFile file(ks)
                storePassword System.getenv("AURUM_KEYSTORE_PASS")
                keyAlias System.getenv("AURUM_KEY_ALIAS")
                keyPassword System.getenv("AURUM_KEY_PASS")
            }
        }
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
            if (ks != null && new File(ks).exists()) signingConfig signingConfigs.aurumRelease
        }
        // Side-by-side preview: its own app id, so it installs NEXT TO any existing Aurum without uninstalling it.
        // Debug-signed, so it isn't for in-place upgrades; it's for trying 2.2 today with zero risk to the installed app.
        preview {
            initWith debug
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }
    testOptions {
        unitTests.all {
            testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = true }
        }
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def media3 = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-session:$media3"
    implementation "androidx.media3:media3-common:$media3"
    implementation "androidx.media3:media3-datasource:$media3"

    implementation platform('androidx.compose:compose-bom:2024.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'com.google.guava:guava:33.2.1-android'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    // JVM fast lane (src/test): pure-logic unit tests, no emulator.
    // Run with `gradle testDebugUnitTest`; gated before the emulator boots.
    testImplementation 'junit:junit:4.13.2'
    // Real org.json on the JVM (Android's stub throws in unit tests): the Takeout importer + Apollo v2 tests need it.
    testImplementation 'org.json:json:20240303'

    // API-34 instrumented tests: tap-to-play queue repair (QueuePlannerTest,
    // TapLatencyTest). Run on the emulator via connectedDebugAndroidTest.
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
}
